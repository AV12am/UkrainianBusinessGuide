name: UkrainianBusinessGuide
options:
  bundleIdPrefix: ua.businesscompass
  developmentLanguage: uk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  UkrainianBusinessGuide:
    type: application
    platform: iOS
    sources:
      - UkrainianBusinessGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.businesscompass.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Бізнес Компас"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  UkrainianBusinessGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UkrainianBusinessGuideTests
    dependencies:
      - target: UkrainianBusinessGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UkrainianBusinessGuide:
    build:
      targets:
        UkrainianBusinessGuide: all
    test:
      targets:
        - UkrainianBusinessGuideTests
