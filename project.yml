name: UkrainianBusinessGuide
options:
  bundleIdPrefix: ua.businesscompass
  developmentLanguage: uk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  UkrainianBusinessGuide:
    type: application
    platform: iOS
    sources:
      - UkrainianBusinessGuide
      - Shared
    dependencies:
      - target: BusinessCompassWidget
    entitlements:
      path: UkrainianBusinessGuide/UkrainianBusinessGuide.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ua.businesscompass.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.businesscompass.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Бізнес Компас"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID захищає ваші фінансові дані від сторонніх."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BusinessCompassWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Бізнес Компас"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BusinessCompassWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ua.businesscompass.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.businesscompass.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  UkrainianBusinessGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UkrainianBusinessGuideTests
    dependencies:
      - target: UkrainianBusinessGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UkrainianBusinessGuide:
    build:
      targets:
        UkrainianBusinessGuide: all
    test:
      targets:
        - UkrainianBusinessGuideTests
